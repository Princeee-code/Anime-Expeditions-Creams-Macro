name: Build Herm's Engine EXE

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build app exe (PyInstaller)
        run: python build_pyinstaller.py

      - name: Package zip (exe + editable Assets folder)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item "dist/Herm's Engine - Anime Expeditions.exe" package/
          Copy-Item Assets package/Assets -Recurse
          Compress-Archive -Path package/* -DestinationPath "dist/Herms-Engine-Anime-Expeditions-Windows.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: herms-engine-windows
          path: |
            dist/Herms-Engine-Anime-Expeditions-Windows.zip
            dist/Herm's Engine - Anime Expeditions.exe
          if-no-files-found: error
