[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "herms-engine"
version = "1.0.0"
description = "Vision-based auto-farm macro for Roblox Anime Expeditions — rebuilt by Hermes"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["anime-expeditions", "roblox", "macro", "auto-farm"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Minimal set: only catch real bugs, not style preferences.
select = ["E", "F", "W"]
ignore = ["E501", "E741"]
unfixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
